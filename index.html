<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS TRADE - Admin Access</title>
    <style>
        body {
            background: linear-gradient(135deg, #061014 0%, #0c2022 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
        }
        .brand-logo {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ffffff, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .tagline {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        .form-card {
            background: rgba(25, 35, 40, 0.7);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 14px 15px;
            background: rgba(15, 23, 25, 0.6);
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
            letter-spacing: 2px;
        }
        .input-group input:focus {
            border-color: #00ffaa;
        }
        .btn-access {
            width: 100%;
            padding: 14px;
            background: #00ffaa;
            border: none;
            border-radius: 8px;
            color: #061014;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn-access:hover {
            opacity: 0.9;
        }
        .footer-text {
            font-size: 12px;
            color: #718096;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-logo">NS TRADE</div>
    <div class="tagline">Your gateway to expert-led, automated trading</div>

    <div class="form-card">
        <div class="form-title">Enter Admin Master Key</div>
        <form id="accessForm">
            <div class="input-group">
                <input type="password" id="masterKey" placeholder="••••••••••••" required>
            </div>
            <button type="submit" class="btn-access">Unlock Platform</button>
        </form>
        <div class="footer-text">
            Admin authenticated platform access portal.
        </div>
    </div>
</div>

<script>
    document.getElementById('accessForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const masterKeyInput = document.getElementById('masterKey').value.trim();
        const accessBtn = e.target.querySelector('button');

        accessBtn.innerText = "Authorizing credentials...";
        accessBtn.disabled = true;

        // LOCAL MASTER PASSWORD CHECK: 100% independent of external script libraries
        if (masterKeyInput === "nasifu123") {
            accessBtn.style.background = "#00ffaa";
            accessBtn.innerText = "✨ Access Granted!";
            setTimeout(() => {
                alert('✨ Welcome to NS TRADE! Connecting to trading dashboard infrastructure...');
            }, 100);
        } else {
            alert('❌ Invalid Master Security Key Passcode.');
            accessBtn.innerText = "Unlock Platform";
            accessBtn.disabled = false;
            document.getElementById('masterKey').value = "";
        }
    });
</script>
</body>
</html>
