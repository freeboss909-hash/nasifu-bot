<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS TRADE - Live Terminal</title>
    <style>
        :root {
            --bg-color: #060d10;
            --sidebar-color: #091316;
            --accent-color: #00ffaa;
            --card-bg: rgba(20, 32, 38, 0.7);
            --border-color: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .platform-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
            position: relative;
        }

        /* SIDEBAR SYSTEM STYLES */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 25px 15px;
            box-sizing: border-box;
        }
        .sidebar-brand {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 40px;
            padding-left: 10px;
        }
        .sidebar-brand span { color: var(--accent-color); }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .menu-item.active { background: rgba(0, 255, 170, 0.05); color: var(--accent-color); }

        /* MAIN CONTENT TERMINAL */
        .main-content {
            flex: 1;
            padding: 40px 20px 100px 20px;
            box-sizing: border-box;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        .dash-title-main {
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 5px 0;
            color: #ffffff;
        }
        .dash-subtitle {
            font-size: 14px;
            color: #a0aec0;
            margin: 0 0 30px 0;
        }

        /* PREMIUM DYNAMIC GRAPHIC WALLET CARDS */
        .wallet-card {
            background: linear-gradient(135deg, rgba(9, 25, 30, 0.9) 0%, rgba(15, 37, 44, 0.9) 100%);
            border: 1px solid rgba(0, 255, 170, 0.08);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .wallet-balance {
            font-size: 32px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .wallet-balance span { font-size: 16px; color: #a0aec0; font-family: 'Segoe UI'; font-weight: 600; }
        .wallet-type {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
        }
        .wallet-icon-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        .section-header {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin: 30px 0 15px 0;
            letter-spacing: 0.5px;
        }

        /* BINANCE CONNECTION NODE */
        .binance-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }
        .binance-info { display: flex; align-items: center; gap: 12px; }
        .binance-icon {
            width: 40px;
            height: 40px;
            background-color: #f3ba2f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #000;
        }
        .binance-label { font-size: 14px; color: #a0aec0; margin-bottom: 2px; }
        .binance-val { font-size: 20px; font-weight: bold; font-family: monospace; }
        .refresh-btn {
            color: var(--accent-color);
            cursor: pointer;
            font-size: 18px;
            background: rgba(0, 255, 170, 0.05);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(0, 255, 170, 0.1);
        }

        /* ADMIN CONTROL DESK COMPONENT */
        .admin-panel {
            background: rgba(25, 35, 40, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        .admin-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: var(--accent-color); }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .admin-input {
            flex: 1;
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border: 1px solid #2d3748;
            border-radius: 6px;
            color: #fff;
            outline: none;
        }
        .admin-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* MOBILE BOTTOM NAVIGATION TAB BAR */
        .mobile-navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background-color: rgba(9, 19, 22, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #718096;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            gap: 4px;
        }
        .nav-tab.active { color: var(--accent-color); }
        .center-hub-btn {
            width: 56px;
            height: 56px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #061014;
            font-size: 22px;
            margin-top: -30px;
            box-shadow: 0 4px 15px rgba(0, 255, 170, 0.3);
            border: 4px solid var(--bg-color);
        }

        @media (min-width: 769px) {
            .mobile-navbar { display: none; }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
