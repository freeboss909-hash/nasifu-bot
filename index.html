<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS TRADE - Terminal</title>
    <style>
        body {
            background: linear-gradient(135deg, #061014 0%, #0c2022 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* APP GATEKEEPER LOCK STYLES */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
        }
        .brand-logo-gate {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ffffff, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .tagline {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        .form-card {
            background: rgba(25, 35, 40, 0.7);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
        }
        .form-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 15px;
            background: rgba(15, 23, 25, 0.6);
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
            letter-spacing: 3px;
        }
        .input-group input:focus {
            border-color: #00ffaa;
        }
        .btn-access {
            width: 100%;
            padding: 14px;
            background: #00ffaa;
            border: none;
            border-radius: 8px;
            color: #061014;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-access:hover {
            opacity: 0.9;
        }

        /* CORE TERMINAL DASHBOARD STRUCTURES */
        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            padding: 30px 20px;
            box-sizing: border-box;
            align-self: flex-start;
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .dash-title {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
        }
        .dash-title span {
            color: #00ffaa;
        }
        
        /* Action Bot Command Buttons Matrix */
        .controls-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-bottom: 25px;
        }
        .btn-control {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-control:active {
            transform: scale(0.98);
        }
        .btn-start {
            background: linear-gradient(135deg, #00ffaa 0%, #00cc88 100%);
            color: #061014;
        }
        .btn-pause {
            background: linear-gradient(135deg, #ff4444 0%, #cc3333 100%);
            color: #ffffff;
        }
        .btn-control:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
            margin-bottom: 25px;
        }
        .metric-card {
            background: rgba(25, 35, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .metric-label {
            font-size: 13px;
            color: #a0aec0;
            text-transform: uppercase;
        }
        .metric-value {
            font-size: 28px;
            font-weight: bold;
        }
        .content-panel {
            background: rgba(25, 35, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        .data-table-wrapper {
            overflow-x: auto;
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            color: #a0aec0;
            padding: 12px;
            border-bottom: 2px solid #2d3748;
            text-align: left;
        }
        td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .badge-status {
            background: rgba(0, 255, 170, 0.1);
            color: #00ffaa;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
