<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS TRADE - Live Portal</title>
    <style>
        :root {
            --bg-color: #060d10;
            --sidebar-color: #091316;
            --accent-color: #00ffaa;
            --card-bg: rgba(20, 32, 38, 0.7);
            --border-color: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SECURE AUTHENTICATION SCREEN FORMS */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
        }
        .brand-logo-gate {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .tagline {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        .form-card {
            background: rgba(25, 35, 40, 0.7);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        .input-group input {
            width: 100%;
            padding: 14px 15px;
            background: rgba(15, 23, 25, 0.6);
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--accent-color);
        }
        .btn-access {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: #061014;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-access:hover { opacity: 0.9; }

            min-height: 100vh;
            background-color: var(--bg-color);
            position: relative;
        }

        /* SIDEBAR HUD NAVIGATION MAPS */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 25px 15px;
            box-sizing: border-box;
        }
        .sidebar-brand {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 40px;
            padding-left: 10px;
        }
        .sidebar-brand span { color: var(--accent-color); }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .menu-item.active { background: rgba(0, 255, 170, 0.05); color: var(--accent-color); }
        .btn-logout {
            margin-top: auto;
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.2);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* TERMINAL CONTENT DISPATCH NODES */
        .main-content {
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
            max-width: 100%;
            overflow-x: hidden;
        }
        .dash-title-main { font-size: 28px; font-weight: bold; margin: 0 0 5px 0; }
        .dash-subtitle { font-size: 14px; color: #a0aec0; margin: 0 0 30px 0; }

        /* WALLET CREDIT CARD INTERFACE GRID */
        .wallet-card {
            background: linear-gradient(135deg, rgba(9, 25, 30, 0.9) 0%, rgba(15, 37, 44, 0.9) 100%);
            border: 1px solid rgba(0, 255, 170, 0.08);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .wallet-balance {
            font-size: 32px;
            font-weight: 700;
            font-family: monospace;
            margin-bottom: 12px;
        }
        .wallet-balance span { font-size: 16px; color: #a0aec0; font-family: 'Segoe UI'; }
        .wallet-type { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }

        .section-header { font-size: 18px; font-weight: bold; margin: 30px 0 15px 0; }
        .binance-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .binance-info { display: flex; align-items: center; gap: 12px; }
        .binance-icon { width: 40px; height: 40px; background-color: #f3ba2f; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .binance-label { font-size: 14px; color: #a0aec0; }
        .binance-val { font-size: 20px; font-weight: bold; font-family: monospace; }

        .mobile-navbar { display: none; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-navbar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--sidebar-color); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
            .nav-tab { display: flex; flex-direction: column; align-items: center; color: #718096; font-size: 11px; font-weight: bold; }
            .nav-tab.active { color: var(--accent-color); }
            .center-hub-btn { width: 56px; height: 56px; background: var(--accent-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #061014; margin-top: -30px; border: 4px solid var(--bg-color); }
        }
    </style>
</head>
