<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS TRADE - Login</title>
    <style>
        body {
            background: linear-gradient(135deg, #061014 0%, #0c2022 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
        }
        .brand-logo {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ffffff, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .tagline {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        .form-card {
            background: rgba(25, 35, 40, 0.7);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 25, 0.6);
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #00ffaa;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #00ffaa;
            border: none;
            border-radius: 8px;
            color: #061014;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .footer-text {
            font-size: 12px;
            color: #718096;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-logo">NS TRADE</div>
    <div class="tagline">Your gateway to expert-led, automated trading</div>

    <div class="form-card">
        <div class="form-title">Account Login</div>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="userName" placeholder="Enter Username" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter Secret Password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <div class="footer-text">
            Contact administrator to request access credential keys.
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('userName').value;
        const password = document.getElementById('password').value;

        const loginBtn = e.target.querySelector('button');
        loginBtn.innerText = "Verifying credentials...";
        loginBtn.disabled = true;

        try {
            // Direct secure query looking for matching username and password combinations
            const response = await fetch(`https://supabase.co{encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}`, {
                method: 'GET',
                headers: {
                    'apikey': 'sb_publishable_NdjGpE8qdeB70LFXR1fWAw_88kiu8Gu',
                    'Authorization': 'Bearer sb_publishable_NdjGpE8qdeB70LFXR1fWAw_88kiu8Gu'
                }
            });

            const data = await response.json();

            if (response.ok && data.length > 0) {
                loginBtn.style.background = "#00ffaa";
                loginBtn.innerText = "✨ Access Granted!";
                alert(`✨ Welcome back, ${data[0].full_name || username}! Connecting to trading core...`);
                // This is where we redirect them to your live trading terminal screen later!
            } else {
                alert('❌ Invalid username or password credential keys.');
                loginBtn.innerText = "Sign In";
                loginBtn.disabled = false;
            }
        } catch (error) {
            alert('❌ Network synchronization issue. Please try again.');
            loginBtn.innerText = "Sign In";
            loginBtn.disabled = false;
        }
    });
</script>
</body>
</html>
