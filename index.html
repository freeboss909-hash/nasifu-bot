<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS TRADE - Network Terminal</title>
    <style>
        :root {
            --bg-color: #060d10;
            --sidebar-color: #091316;
            --accent-color: #00ffaa;
            --card-bg: rgba(20, 32, 38, 0.7);
            --border-color: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 6-DIGIT PIN GATEKEEPER DISPLAY */
        .pin-container {
            width: 100%;
            max-width: 360px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .brand-logo-gate {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .tagline {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        .pin-display-wrapper {
            background: rgba(15, 23, 25, 0.6);
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 15px;
            font-size: 32px;
            font-family: monospace;
            letter-spacing: 6px;
            color: var(--accent-color);
            margin-bottom: 25px;
            min-height: 38px;
        }
        .pin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        .pin-btn {
            background: rgba(25, 35, 40, 0.7);
            border: 1px solid rgba(255,255,255,0.03);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            padding: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .pin-btn:active { background: var(--accent-color); color: #000; }
        .pin-btn.clear { color: #ff4444; font-size: 18px; }

        /* LIVE SYSTEM CONTAINER FRAMEWORK */
        #appMasterContainer { width: 100%; height: 100%; }
        .platform-wrapper { display: flex; width: 100%; min-height: 100vh; background-color: var(--bg-color); position: relative; }

        /* SIDEBAR SYSTEM HOUSING */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 25px 15px;
            box-sizing: border-box;
        }
        .sidebar-brand { font-size: 26px; font-weight: 800; letter-spacing: 1px; margin-bottom: 40px; padding-left: 10px; }
        .sidebar-brand span { color: var(--accent-color); }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #e2e8f0; font-size: 15px; font-weight: 600; border-radius: 8px; margin-bottom: 8px; }
        .menu-item.active { background: rgba(0, 255, 170, 0.05); color: var(--accent-color); }
        .logout-btn { margin-top: auto; background: rgba(255, 68, 68, 0.08); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.15); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* MAIN DASHBOARD MATRIX */
        .main-content { flex: 1; padding: 40px 20px 100px 20px; box-sizing: border-box; max-width: 100%; overflow-x: hidden; }
        .dash-title-main { font-size: 28px; font-weight: bold; margin: 0 0 5px 0; }
        .dash-subtitle { font-size: 14px; color: #a0aec0; margin: 0 0 30px 0; }

        /* BOT CONTROL COMMAND PACK */
        .controls-wrapper { display: flex; gap: 15px; margin-bottom: 25px; }
        .btn-control { flex: 1; padding: 16px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
        .btn-start { background: linear-gradient(135deg, #00ffaa 0%, #00cc88 100%); color: #061014; }
        .btn-pause { background: linear-gradient(135deg, #ff4444 0%, #cc3333 100%); color: #ffffff; }
        .btn-control:disabled { opacity: 0.4; cursor: not-allowed; }

        /* PREMIUM METRIC WALLET CARDS */
        .wallet-card {
            background: linear-gradient(135deg, rgba(9, 25, 30, 0.9) 0%, rgba(15, 37, 44, 0.9) 100%);
            border: 1px solid rgba(0, 255, 170, 0.08);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .wallet-balance { font-size: 32px; font-weight: 700; font-family: monospace; margin-bottom: 12px; }
        .wallet-balance span { font-size: 16px; color: #a0aec0; }
        .wallet-type { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: #e2e8f0; }

        .section-header { font-size: 18px; font-weight: bold; margin: 30px 0 15px 0; }
        
        .api-config-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.04); border-radius: 14px; padding: 20px; margin-bottom: 25px; }
        .api-status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; background: rgba(255,170,0,0.1); color: #ffaa00; }

        .mobile-navbar { display: none; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-navbar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background-color: var(--sidebar-color); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
            .nav-tab { display: flex; flex-direction: column; align-items: center; color: #718096; font-size: 11px; font-weight: bold; }
            .nav-tab.active { color: var(--accent-color); }
        }
    </style>
</head>
