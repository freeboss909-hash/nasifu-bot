<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS TRADE - Live Quant Terminal</title>
    <style>
        :root {
            --bg-color: #060d10;
            --sidebar-color: #091316;
            --accent-color: #00ffaa;
            --card-bg: rgba(20, 32, 38, 0.7);
            --border-color: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MASTER AUTH PANEL WRAPPERS */
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 25px;
            box-sizing: border-box;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand-logo {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .brand-tag { font-size: 13px; color: #a0aec0; margin-top: 4px; }
        
        .auth-card {
            background: rgba(25, 35, 40, 0.65);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }
        .auth-toggle {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .toggle-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #718096;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
        }
        .toggle-btn.active { background: var(--accent-color); color: #061014; }
        
        .form-view { display: none; }
        .form-view.active-view { display: block; }
        
        .input-group { margin-bottom: 15px; }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(10, 18, 22, 0.7);
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--accent-color); }
        .input-group select option { background: var(--sidebar-color); color: #fff; }
        
        .auth-submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: #061014;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 5px;
        }
        .auth-submit-btn:hover { opacity: 0.9; }

        /* PRODUCTION WORKSPACE CORE */
        .platform-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
        }
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 25px 15px;
            box-sizing: border-box;
        }
        .sidebar-brand { font-size: 26px; font-weight: 800; letter-spacing: 1px; margin-bottom: 40px; padding-left: 10px; }
        .sidebar-brand span { color: var(--accent-color); }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #e2e8f0; font-size: 15px; font-weight: 600; border-radius: 8px; margin-bottom: 6px; }
        .menu-item.active { background: rgba(0, 255, 170, 0.05); color: var(--accent-color); }
        .logout-btn { margin-top: auto; background: rgba(255, 68, 68, 0.08); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.15); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .main-content { flex: 1; padding: 40px 25px 100px 25px; box-sizing: border-box; overflow-y: auto; }
        .user-greeting { font-size: 24px; font-weight: bold; margin: 0 0 5px 0; }
        .user-subtext { font-size: 14px; color: #a0aec0; margin: 0 0 25px 0; }

        /* PLATFORM CONTROL & WALLET CARDS */
        .wallet-card {
            background: linear-gradient(135deg, rgba(9, 25, 30, 0.9) 0%, rgba(15, 37, 44, 0.9) 100%);
            border: 1px solid rgba(0, 255, 170, 0.06);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .wallet-balance { font-size: 30px; font-weight: 700; font-family: monospace; margin-bottom: 8px; }
        .wallet-balance span { font-size: 15px; color: #a0aec0; font-family: 'Segoe UI'; }
        .wallet-type { font-size: 14px; font-weight: 600; color: #e2e8f0; display: flex; align-items: center; gap: 8px; }

        .section-header { font-size: 18px; font-weight: bold; margin: 25px 0 15px 0; }
        
        .api-config-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .api-status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .execution-panel { background: var(--sidebar-color); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
        th { color: #a0aec0; padding: 10px; border-bottom: 2px solid #2d3748; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.02); }

        .mobile-navbar { display: none; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { padding: 25px 15px 90px 15px; }
            .mobile-navbar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--sidebar-color); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
            .nav-tab { display: flex; flex-direction: column; align-items: center; color: #718096; font-size: 11px; font-weight: bold; }
            .nav-tab.active { color: var(--accent-color); }
        }
    </style>
</head>
<body>

    <div id="runtimeAppContainer" style="width: 100%;">
        
        <!-- GATEWAY STAGE: PORTAL AUTHENTICATION SHIELD -->
        <div class="auth-container" id="authInterfaceWindow" style="margin: 0 auto;">
            <div class="brand-header">
                <div class="brand-logo">NS TRADE</div>
                <div class="brand-tag">Expert-Led Algorithmic Asset Maximization</div>
            </div>

            <div class="auth-card">
                <div class="auth-toggle">
                    <button class="toggle-btn active" id="toggleLoginBtn" onclick="shiftAuthMode('login')">Sign In</button>
                    <button class="toggle-btn" id="toggleRegisterBtn" onclick="shiftAuthMode('register')">Register</button>
                </div>

                <!-- FORM ELEMENT 1: LOGIN FRAME -->
                <div id="loginFormWrapper" class="form-view active-view">
                    <form id="terminalLoginForm">
                        <div class="input-group">
                            <input type="text" id="logUser" placeholder="Username" required>
                        </div>
                        <div class="input-group">
                            <input type="password" id="logPass" placeholder="Secret Password" required>
                        </div>
                        <button type="submit" class="auth-submit-btn">Access Secure Terminal</button>
                    </form>
                </div>

                <!-- FORM ELEMENT 2: REGISTRATION FRAME -->
                <div id="registerFormWrapper" class="form-view">
                    <form id="terminalRegisterForm">
                        <div class="input-group">
                            <input type="text" id="regName" placeholder="Full Name" required>
                        </div>
                        <div class="input-group">
                            <input type="text" id="regUser" placeholder="Choose Unique Username" required>
                        </div>
                        <div class="input-group">
                            <select id="regCountry" required>
                                <option value="" disabled selected>Select Region</option>
                                <option value="Uganda">Uganda (UG)</option>
                                <option value="Kenya">Kenya (KE)</option>
                                <option value="Tanzania">Tanzania (TZ)</option>
                                <option value="United Arab Emirates">UAE</option>
                                <option value="United Kingdom">United Kingdom (UK)</option>
                            </select>
                        </div>
                        <div class="input-group">
