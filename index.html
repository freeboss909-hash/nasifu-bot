<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS TRADE - QR Login</title>
    <!-- Secure, lightweight open-source HTML5 QR Code library scanner -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body {
            background: linear-gradient(135deg, #061014 0%, #0c2022 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            text-align: center;
        }
        .brand-logo {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ffffff, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .tagline {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        .form-card {
            background: rgba(25, 35, 40, 0.7);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        #reader {
            width: 100%;
            background: rgba(15, 23, 25, 0.6);
            border-radius: 12px;
            border: 2px dashed #2d3748;
            overflow: hidden;
            margin-bottom: 20px;
            min-height: 100px;
        }
        .file-upload-wrapper {
            margin: 15px 0;
        }
        .custom-file-btn {
            background: #00ffaa;
            color: #061014;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }
        .custom-file-btn:hover {
            opacity: 0.9;
        }
        #qr-input-file {
            display: none;
        }
        .status-text {
            font-size: 14px;
            color: #a0aec0;
            margin-top: 15px;
            line-height: 1.4;
        }
        .footer-text {
            font-size: 12px;
            color: #718096;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-logo">NS TRADE</div>
    <div class="tagline">Your gateway to expert-led, automated trading</div>

    <div class="form-card">
        <div class="form-title">Scan QR Pass to Enter</div>
        
        <!-- Camera scanning box wrapper -->
        <div id="reader">
            <div class="file-upload-wrapper">
                <button class="custom-file-btn" onclick="document.getElementById('qr-input-file').click()">📂 Upload QR Pass Image</button>
                <input type="file" id="qr-input-file" accept="image/*">
            </div>
        </div>
        
        <div id="status" class="status-text">Select your secure QR pass screenshot file or scan it to authorize device parameters.</div>
        
        <div class="footer-text">
            Admin authenticated platform access portal.
        </div>
    </div>
</div>

<script>
    function verifyToken(decodedText) {
        const statusDiv = document.getElementById('status');
        
        // SECURE MASTER AUTHENTICATION CHECK
        if (decodedText.trim() === "NSTRADE_MASTER_ADMIN_2026_SECURE") {
            statusDiv.innerHTML = "<span style='color: #00ffaa; font-weight: bold;'>✨ Key Token Verified!</span>";
            setTimeout(() => {
                alert('✨ Access Granted! Welcome to NS TRADE. Loading trading infrastructure...');
            }, 100);
        } else {
            statusDiv.innerHTML = "<span style='color: #ff4444; font-weight: bold;'>❌ Invalid Verification Code Pass Key.</span>";
            alert('❌ Invalid QR Code security pass key.');
        }
    }

    // Initialize File-based local image scanning mechanics
    const html5QrCode = new Html5Qrcode("reader");
    const fileInput = document.getElementById('qr-input-file');
    
    fileInput.addEventListener('change', e => {
        if (e.target.files.length == 0) return;
        
        const imageFile = e.target.files[0];
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Analyzing file graphic layers...";

        html5QrCode.scanFile(imageFile, true)
        .then(decodedText => {
            verifyToken(decodedText);
        })
        .catch(err => {
            statusDiv.innerHTML = "<span style='color: #ffaa00;'>⚠️ Scanner could not decode image block. Make sure the QR is clear.</span>";
        });
    });

    // Attempt to start camera scanner inside the container card layout
    try {
        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
        html5QrcodeScanner.render((text) => verifyToken(text), () => {});
    } catch(e) {
        // Fallback gracefully to file handling upload modes if camera drivers fail to mount
    }
</script>
</body>
</html>
