<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS TRADE - QR Login</title>
    <!-- Secure, lightweight open-source HTML5 QR Code library scanner -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body {
            background: linear-gradient(135deg, #061014 0%, #0c2022 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            text-align: center;
        }
        .brand-logo {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ffffff, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .tagline {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        .form-card {
            background: rgba(25, 35, 40, 0.7);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        #reader {
            width: 100%;
            background: rgba(15, 23, 25, 0.6);
            border-radius: 12px;
            border: 2px dashed #2d3748;
            overflow: hidden;
            margin-bottom: 20px;
        }
        /* Styling the internal library buttons to match NS TRADE theme */
        #reader button {
            background: #00ffaa !important;
            color: #061014 !important;
            border: none !important;
            padding: 10px 20px !important;
            font-size: 14px !important;
            font-weight: bold !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            margin: 15px 0 !important;
            transition: opacity 0.2s;
        }
        #reader button:hover {
            opacity: 0.9 !important;
        }
        .status-text {
            font-size: 14px;
            color: #a0aec0;
            margin-top: 10px;
        }
        .footer-text {
            font-size: 12px;
            color: #718096;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-logo">NS TRADE</div>
    <div class="tagline">Your gateway to expert-led, automated trading</div>

    <div class="form-card">
        <div class="form-title">Scan QR Pass to Enter</div>
        
        <!-- Camera scanning box wrapper -->
        <div id="reader"></div>
        
        <div id="status" class="status-text">Hold your unique QR credential pass up to the camera lens.</div>
        
        <div class="footer-text">
            Admin authenticated platform access portal.
        </div>
    </div>
</div>

<script>
    function onScanSuccess(decodedText, decodedResult) {
        // Stop scanning once a match is successfully identified
        html5QrcodeScanner.clear();
        
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = "<span style='color: #00ffaa; font-weight: bold;'>✨ Key Token Verified!</span>";
        
        // SECURE TOKEN CHECK: Verifies your specific master admin code payload
        if (decodedText.trim() === "NSTRADE_MASTER_ADMIN_2026_SECURE") {
            setTimeout(() => {
                alert('✨ Access Granted! Welcome to NS TRADE. Loading trading infrastructure...');
                // Your trading application workspace link goes right here later!
            }, 100);
        } else {
            alert('❌ Invalid QR Code security pass key.');
            location.reload(); // Refresh the page to reset the scanner
        }
    }

    function onScanFailure(error) {
        // Silent catch for scanning frame attempts to prevent log crowding
    }

    // Initialize the scanner inside the container card layout
    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        /* verbose= */ false
    );
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
</script>
</body>
</html>
